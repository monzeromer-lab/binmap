[package]
name = "deep"
version = "0.1.0"
edition = "2024"
description = """
Reference corpus, entry five: an application with a deep dependency tree. \
Most of its bytes belong to crates its author did not write, which is the \
common case and the one attribution has to get right."""

[[bin]]
name = "deep"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[profile.release]
opt-level = 3
