# The CI gate §8 asks for.
#
# "The full suite runs under the null backend, and that is the CI gate that
# keeps the deterministic core deterministic." No model is called anywhere in
# this workflow, and the suite must pass without one.
#
# It also runs the things that were claimed to be enforced and were not until
# an audit checked: cargo-deny's dependency bans, which are what actually hold
# §2.4's "the interface may not compute" in place.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No provider is configured, so nothing can reach a model even by accident.
  BINMAP_MODEL_BACKEND: null

jobs:
  suite:
    name: Test suite, null backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  boundary:
    name: Architectural boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `bans` is the one that matters: binmap-gui may not depend on
          # anything that computes. The rest are hygiene.
          command: check bans licenses advisories

  acceptance:
    name: Phase 0 and Phase 1 acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Measured through the headless harness, never through the interface
      # (A1.3). An engine feature that cannot be exercised without a window is
      # a layering violation, and this is where that gets caught.
      - name: Environment
        run: cargo run --release -p binmap-eval -- doctor corpus/tiny
        continue-on-error: true

      - name: Acceptance criterion
        run: cargo run --release -p binmap-eval -- acceptance corpus/tiny --jobs 4

      # Phase 1: the gates that matter are that attribution runs at all and
      # that a crate which cannot be attributed says so rather than failing.
      - name: Size attribution
        run: cargo run --release -p binmap-eval -- size corpus/stress

      - name: The gates reject what breaks the suite
        run: cargo test --release -p binmap-build --test corpus

      # All three clauses of Phase 1's criterion, measured rather than
      # asserted: the top generics are identified and genuinely collapsible, a
      # configuration reduces size by 5% with its gates passing, and every
      # finding cites evidence the session issued.
      - name: Phase 1 acceptance criterion
        run: cargo run --release -p binmap-eval -- acceptance1 corpus/stress --jobs 4

      # The reasoner is reachable headlessly (A1.3). With no model configured
      # this must refuse with a sentence and a non-zero exit, not sit there.
      - name: The reasoner refuses honestly with no model
        run: |
          if cargo run --release -p binmap-eval -- reason corpus/stress; then
            echo "a session with no reasoner should not have succeeded" && exit 1
          fi

      - name: The provider table is listable
        run: cargo run --release -p binmap-eval -- reasoners corpus/stress

  crash:
    name: Phase 2 — crash analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The cores are captured rather than committed: megabytes each, and only
      # meaningful beside the exact binary that produced them. Three of the
      # bugs these tests caught were invisible to any synthetic fixture.
      - name: Capture core dumps
        run: |
          sudo apt-get update && sudo apt-get install -y gdb
          ./corpus/crasher/capture.sh

      - name: Analyse a real core
        run: |
          cargo run --release -p binmap-eval -- crash \
            corpus/crasher/cores/segv.core corpus/crasher/target/release/crasher

      # A binary that did not produce the core must be refused, not symbolized:
      # the stack would be entirely plausible and entirely wrong.
      - name: A mismatched binary is refused
        run: |
          if cargo run --release -p binmap-eval -- crash \
               corpus/crasher/cores/segv.core corpus/crasher/cores/crasher-abort; then
            echo "::error::a mismatched binary should have been refused" && exit 1
          fi

      - name: Crash analysis tests
        run: cargo test --release -p binmap-crash

  web:
    name: Phase 1.5 — the web backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The web tests run against output from a real bundler rather than a
      # fixture written to pass them. Two of the bugs they caught — esbuild
      # marking a lazily imported chunk as an entry point, and an unmapped
      # trailing line being absorbed into the last source — were only visible
      # against a real build.
      - name: Build the web corpus
        working-directory: corpus/web
        run: |
          npm install --no-audit --no-fund
          npm run build:split

      - name: Attribute the bundle
        run: cargo run --release -p binmap-eval -- web corpus/web

      - name: Web backend tests
        run: cargo test --release -p binmap-web

      # The sweep drives esbuild by CLI flags into a directory of ours, so it
      # proves the rule that matters: the user's config files and their
      # existing dist/ are never touched.
      - name: Sweep the web configuration matrix
        run: cargo run --release -p binmap-eval -- web-sweep corpus/web --targets-only

      # The deliberately badly-configured corpus, with real npm packages. A
      # rule that only fires on a metafile written by hand is a rule that has
      # never met production.
      - name: Build the badly-configured corpus
        working-directory: corpus/web-heavy
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: The findings fire on real dependencies
        run: |
          output=$(cargo run --release -p binmap-eval -- web corpus/web-heavy)
          echo "$output"
          for rule in web-whole-library-import web-polyfill-cost web-node-polyfill; do
            echo "$output" | grep -q "$rule" || { echo "::error::$rule did not fire"; exit 1; }
          done
