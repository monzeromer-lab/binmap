# cargo-deny — the architectural boundary, enforced (DESIGN-GUI §4, TOOLING §6).
#
# §2.4's rule is that the interface may not compute. The crate split makes that
# true today; this file is what keeps it true when a contributor adds one
# convenient dependency at 2am. Run in CI:
#
#     cargo deny check bans licenses advisories
#
# All three pass. `bans` is the architectural one and the reason this file
# exists; the other two were added once they were made to pass, because a check
# that has never passed is a check nobody can use.
#
# This config is itself checked: an earlier version failed on its own workspace
# because `wildcards = "deny"` flags path dependencies, which every workspace
# member is. The rule is only worth having if it runs.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[bans]
multiple-versions = "allow"
# Path dependencies inside a workspace are declared without a version, which
# reads as a wildcard. Banning wildcards would fail on our own crates and teach
# everyone to pass --no-deny-warnings, which is worse than not checking.
wildcards = "allow"

# The ban that matters. binmap-gui renders; it does not analyse. It reaches
# analyses through binmap_core::facade::Engine and must not be able to reach
# them any other way — so it may not depend on a crate that has one.
#
# `deny` names a crate nothing may depend on; `wrappers` lists the crates that
# may. Every wrapper here is a real dependent, because cargo-deny warns about
# one that is not and a warning nobody reads is how this file rots.
# binmap-binary reads ELF files and binmap-agent talks to models. Neither is
# something the interface may reach: it renders an Attribution, whose *shape*
# lives in binmap-core precisely so that rendering it costs no dependency on
# the crate that computes it.
[[bans.deny]]
name = "binmap-binary"
wrappers = ["binmap-build", "binmap-crash", "binmap-eval"]

# binmap-crash reads core dumps and unwinds stacks. An analysis, so the
# interface may not reach it: the Stack Pane renders frames whose *shape* the
# interface knows, and symbolizing one is not something a view may do.
#
# It reaches binmap-binary because a core is only meaningful beside the binary
# that produced it — the symbol table and the line table are the same ones
# `F1.6` already reads, and a second copy of that lookup would drift from the
# first.
[[bans.deny]]
name = "binmap-crash"
wrappers = ["binmap-eval", "binmap-perf"]

# binmap-perf attributes samples. It reaches binmap-crash because `F3.2` says
# samples go "through the same symbolization layer the crash analyzer uses" —
# two implementations of that lookup would drift, and the inline handling,
# which matters most to a profiler, would drift first.
[[bans.deny]]
name = "binmap-perf"
wrappers = ["binmap-eval"]

# binmap-dotnet reads the ILC dependency graph and the toolchain's trim
# warnings. An analysis like the others, so the interface may not reach it.
[[bans.deny]]
name = "binmap-dotnet"
wrappers = ["binmap-eval"]

# binmap-replay drives a debugger. The interface renders a timeline whose
# shape it knows; controlling an rr replay is not something a view may do.
[[bans.deny]]
name = "binmap-replay"
wrappers = ["binmap-eval"]

# And now binmap-agent, which was waiting for a dependent. A `deny` entry with
# no wrappers forbids a crate from the graph entirely, so this could not be
# written while nothing called it; orchestration now does, and the ban is real.
#
# Orchestration only, and never binmap-gui. §2.4 runs the dependency the
# opposite way to everyone's instinct: the model may not lead an analysis, so an
# analysis crate may not reach the model layer, and the interface may not lead
# anything at all. The Agent panel renders a transcript whose *shape* lives in
# binmap-core exactly so that rendering one costs no dependency on the crate
# that ran it.
#
# binmap-eval is on this list because it is the headless application, not the
# interface: `A1.3` makes it the thing that drives the loop, and `A2.2`'s MCP
# server is a process an external agent spawns rather than a view anyone
# renders. A feature only the GUI could reach would be a feature nobody could
# test, which is the opposite of what this boundary is protecting.
[[bans.deny]]
name = "binmap-agent"
wrappers = ["binmap-build", "binmap-eval"]

[[bans.deny]]
name = "binmap-build"
wrappers = ["binmap", "binmap-eval"]

[[bans.deny]]
name = "binmap-measure"
wrappers = ["binmap-build", "binmap-eval"]

[[bans.deny]]
name = "binmap-verify"
wrappers = ["binmap", "binmap-build", "binmap-measure", "binmap-eval"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    # Public-domain-equivalent, and so more permissive than everything above
    # rather than less: 0BSD drops BSD's attribution clause, CC0 is a dedication
    # to the public domain. Absent from the list because nobody had hit them
    # yet, not because they were considered and rejected.
    "0BSD",
    "CC0-1.0",
    # The bzip2 licence is BSD-style with a no-misrepresentation clause. Arrives
    # with libbz2-rs-sys, which is a decompressor, not something we link into a
    # measurement.
    "bzip2-1.0.6",
]

[advisories]
yanked = "deny"

# Six unmaintained crates, and every one of them arrives through `gpui-kit`:
#
#   bincode         → syntect → gpui-base
#   instant         → gpui-base
#   paste           → gpui-component
#   rustls-pemfile  → gpui-pre-reqwest
#   rustybuzz       → usvg → gpui-pre
#   ttf-parser      → fontdb → cosmic-text → gpui-pre-wgpu
#
# None is a vulnerability — "unmaintained" means nobody is shipping fixes, not
# that there is something to fix. None is reachable from the engine crates,
# which are what actually compute the numbers this product reports: they come
# in with the *interface's* font shaping, SVG rendering and syntax
# highlighting. TOOLING §6 predicted exactly this coupling, that a GPUI
# upgrade would block a release without blocking development, and the answer
# there was to let it degrade rather than block.
#
# These are listed individually, and deliberately not as a blanket
# `unmaintained = "allow"`. The point of running the check at all is to hear
# about the *next* advisory — above all a vulnerability, which is what
# RUSTSEC-2026-0285 in rustls was until `cargo update -p rustls` moved it to
# 0.23.45. Each entry here was traced before it was added, and an entry that
# stops matching is a warning cargo-deny will raise on its own.
ignore = [
    "RUSTSEC-2025-0141", # bincode
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    "RUSTSEC-2025-0134", # rustls-pemfile
    "RUSTSEC-2026-0206", # rustybuzz
    "RUSTSEC-2026-0192", # ttf-parser
]
