# cargo-deny — the architectural boundary, enforced (DESIGN-GUI §4, TOOLING §6).
#
# §2.4's rule is that the interface may not compute. The crate split makes that
# true today; this file is what keeps it true when a contributor adds one
# convenient dependency at 2am. Run in CI:
#
#     cargo deny check bans
#
# This config is itself checked: an earlier version failed on its own workspace
# because `wildcards = "deny"` flags path dependencies, which every workspace
# member is. The rule is only worth having if it runs.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[bans]
multiple-versions = "allow"
# Path dependencies inside a workspace are declared without a version, which
# reads as a wildcard. Banning wildcards would fail on our own crates and teach
# everyone to pass --no-deny-warnings, which is worse than not checking.
wildcards = "allow"

# The ban that matters. binmap-gui renders; it does not analyse. It reaches
# analyses through binmap_core::facade::Engine and must not be able to reach
# them any other way — so it may not depend on a crate that has one.
#
# `deny` names a crate nothing may depend on; `wrappers` lists the crates that
# may. Every wrapper here is a real dependent, because cargo-deny warns about
# one that is not and a warning nobody reads is how this file rots.
# binmap-binary reads ELF files and binmap-agent talks to models. Neither is
# something the interface may reach: it renders an Attribution, whose *shape*
# lives in binmap-core precisely so that rendering it costs no dependency on
# the crate that computes it.
[[bans.deny]]
name = "binmap-binary"
wrappers = ["binmap-build", "binmap-eval"]

# binmap-agent is not banned *yet*, and that is deliberate rather than an
# oversight. Nothing depends on it, and a `deny` entry with no wrappers forbids
# the crate from being in the graph at all — which fails on its own workspace
# member. The moment orchestration starts calling it, this becomes:
#
#     [[bans.deny]]
#     name = "binmap-agent"
#     wrappers = ["binmap-build"]
#
# and never binmap-gui, because "the model may not lead an analysis" (§2.4)
# and the interface may not lead anything.

[[bans.deny]]
name = "binmap-build"
wrappers = ["binmap", "binmap-eval"]

[[bans.deny]]
name = "binmap-measure"
wrappers = ["binmap-build", "binmap-eval"]

[[bans.deny]]
name = "binmap-verify"
wrappers = ["binmap", "binmap-build", "binmap-measure", "binmap-eval"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[advisories]
yanked = "deny"
