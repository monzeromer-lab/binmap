[workspace]
resolver = "3"
members = [
    "crates/binmap",
    "crates/binmap-core",
    "crates/binmap-verify",
    "crates/binmap-agent",
    "crates/binmap-crash",
    "crates/binmap-dotnet",
    "crates/binmap-perf",
    "crates/binmap-replay",
    "crates/binmap-web",
    "crates/binmap-binary",
    "crates/binmap-build",
    "crates/binmap-measure",
    "crates/binmap-session",
    "crates/binmap-eval",
    "crates/binmap-gui",
]

# The reference corpus is a set of standalone projects Binmap is pointed at,
# not crates it builds. Excluding them keeps `cargo test --workspace` from
# compiling material whose whole purpose is to be built ninety-six ways by
# something else.
exclude = ["corpus"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/monzeromer-lab/binmap"

[workspace.dependencies]
proptest = "1.11"
rustc-demangle = "0.1"
addr2line = "0.26"
binmap-core = { path = "crates/binmap-core" }
binmap-verify = { path = "crates/binmap-verify" }
binmap-agent = { path = "crates/binmap-agent" }
binmap-crash = { path = "crates/binmap-crash" }
binmap-dotnet = { path = "crates/binmap-dotnet" }
binmap-perf = { path = "crates/binmap-perf" }
binmap-replay = { path = "crates/binmap-replay" }
binmap-web = { path = "crates/binmap-web" }
binmap-binary = { path = "crates/binmap-binary" }
binmap-build = { path = "crates/binmap-build" }
binmap-measure = { path = "crates/binmap-measure" }
binmap-session = { path = "crates/binmap-session" }
binmap-gui = { path = "crates/binmap-gui" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

# TOOLING.md §1: link in when the output is structured data queried repeatedly;
# shell out when the tool is years of specialised work producing a report.
# `wasm` alongside `elf` because a WASM module is a Rust target, and a size
# report that says "no sections" for one has not degraded honestly, it has
# just stopped looking.
# DWARF, for crash analysis. Matched to what `addr2line` resolves, so a
# `gimli::Reader` is the same type on both sides of the boundary — the two
# disagreeing produces type errors that read as unrelated. A second, older
# gimli is in the lockfile via gpui's backtrace crate; that one is not in our
# tree and nothing here links against it.
gimli = "0.33"
object = { version = "0.40.0", default-features = false, features = ["read", "std", "elf", "wasm"] }
cargo_metadata = "0.23.1"
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
# ACP's protocol types. The design names `agent-client-protocol` and says to
# prefer it over hand-rolling JSON-RPC, because the protocol is versioned and a
# hand-rolled client drifts silently. The `-schema` crate is that crate's type
# half without its async runtime: the full crate pulls tokio and thirty-odd
# futures dependencies into an engine that is deliberately blocking
# everywhere else. The types are what drift; the transport is ours already.
agent-client-protocol-schema = "1.9"

# A blocking HTTP client, matching the blocking `ModelBackend`. Chosen over
# reqwest because reqwest would pull an async runtime into the engine for a
# request the loop makes one at a time and waits for anyway. TLS is rustls
# rather than the platform store so the build does not depend on OpenSSL.
# TOOLING-WEB §2.1 is explicit that hand-rolling a VLQ decoder is a false
# economy: index maps, relative resolution and one-versus-zero-based line
# conventions across producers are exactly the edge cases that get missed.
# The ILC dependency graph is DGML, which is XML. A streaming reader
# rather than a DOM one: a graph for a real application has hundreds of
# thousands of nodes, and holding all of them to answer one question about
# one of them is the wrong shape.
quick-xml = "0.41"
sourcemap = "9"
flate2 = "1"
brotli = "8"
ureq = { version = "3", default-features = false, features = ["rustls"] }
toml_edit = "0.25.13"
similar = "3.2.0"
statrs = "0.19.1"
clap = { version = "4.6.6", features = ["derive"] }
tempfile = "3.27.0"

[profile.release]
debug = 1
